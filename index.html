<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appel léger</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  #box{position:relative;width:100%;max-width:480px}
  video{width:100%;background:#000;border-radius:10px;display:block}
  #me{width:110px;position:absolute;right:8px;top:8px;opacity:.9;border-radius:8px}
  input,button{font-size:16px;padding:10px;border-radius:8px;border:0}
  button{background:#e0457b;color:#fff;cursor:pointer}
  #s{font-size:14px;opacity:.9;text-align:center}
  #relay{font-size:13px}
  #dbg{font-size:12px;opacity:.7}
  #log{font-size:11px;font-family:monospace;opacity:.6;width:100%;max-width:480px;max-height:160px;overflow:auto;background:#000;padding:6px;border-radius:6px;white-space:pre-wrap}
</style>
</head>
<body>
  <div id="join">
    <input id="code" placeholder="code secret (ex: nous2026)">
    <button onclick="start('a')">Je lance l'appel</button>
    <button onclick="start('b')">Je rejoins</button>
  </div>

  <div id="s">Mettez le même code tous les deux.</div>
  <div id="relay"></div>
  <div id="dbg"></div>

  <div id="box">
    <video id="remote" autoplay playsinline onclick="this.muted=false;this.play()"></video>
    <video id="me" autoplay playsinline muted></video>
  </div>

  <button id="cam" style="display:none" onclick="toggleCam()">Couper la vidéo (audio seul)</button>
  <div id="log"></div>

<script>
// ====== CONFIG TURN (Metered) ======
const ICE = [
  { urls: "stun:stun.relay.metered.ca:80" },
  { urls: "turn:global.relay.metered.ca:80",
    username: "403d8a7db25a819098d7d8c9", credential: "go7c760i2qYbDGN1" },
  { urls: "turn:global.relay.metered.ca:80?transport=tcp",
    username: "403d8a7db25a819098d7d8c9", credential: "go7c760i2qYbDGN1" },
  { urls: "turn:global.relay.metered.ca:443",
    username: "403d8a7db25a819098d7d8c9", credential: "go7c760i2qYbDGN1" },
  { urls: "turns:global.relay.metered.ca:443?transport=tcp",
    username: "403d8a7db25a819098d7d8c9", credential: "go7c760i2qYbDGN1" }
];

const $ = id => document.getElementById(id);
let stream, peer, call, ok = false, retryTimer = null, statsTimer = null;

function status(t){ $('s').textContent = t; }
function log(t){
  const d = new Date().toLocaleTimeString('fr-FR');
  $('log').textContent += d + ' ' + t + '\n';
  $('log').scrollTop = $('log').scrollHeight;
}

// Test du relais : on doit obtenir au moins un candidat "typ relay"
function testRelay(){
  return new Promise(resolve => {
    const pc = new RTCPeerConnection({ iceServers: ICE, iceTransportPolicy: 'relay' });
    let found = false;
    const done = v => { if(!found || v){ found = found || v; } try{ pc.close(); }catch(e){} resolve(v); };
    pc.createDataChannel('t');
    pc.onicecandidate = e => {
      if(e.candidate){
        log('cand: ' + e.candidate.candidate.split(' ').slice(4,8).join(' '));
        if(e.candidate.candidate.includes(' typ relay')) done(true);
      }
    };
    pc.onicecandidateerror = e => log('ICE ERROR ' + e.errorCode + ' ' + (e.url||''));
    pc.createOffer().then(o => pc.setLocalDescription(o));
    setTimeout(() => done(false), 8000);
  });
}

async function start(role){
  const code = $('code').value.trim().toLowerCase().replace(/\W/g,'');
  if(code.length < 4) return status('Code trop court (4 caractères min).');

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ width:{ideal:160}, height:{ideal:120}, frameRate:{ideal:8, max:10} },
      audio:{ echoCancellation:true, noiseSuppression:true, channelCount:1 }
    });
  }catch(e){ return status('Caméra/micro refusés : ' + e.message); }

  $('me').srcObject = stream;
  $('join').style.display = 'none';
  $('cam').style.display = 'block';

  log('TURN : Metered configuré');
  $('relay').textContent = 'Test du relais…';
  const good = await testRelay();
  $('relay').textContent = good ? 'Relais : OK ✔' : 'Relais : REFUSÉ ✘ (attendre 2 min après création des identifiants, ou réseau qui bloque)';
  log('testRelay = ' + good);

  connect(code, role);
}

// Rôle 'a' = attend, rôle 'b' = appelle (et réessaie tant que l'autre n'est pas là)
function connect(code, role){
  const me = 'call-' + code + '-' + role;
  const other = 'call-' + code + '-' + (role === 'a' ? 'b' : 'a');

  peer = new Peer(me, { config: { iceServers: ICE, iceTransportPolicy: 'relay' } });

  peer.on('open', id => {
    log('peer open: ' + id);
    if(role === 'a'){
      status('En attente de l\'autre personne…');
    } else {
      tryCall();
    }
  });

  peer.on('call', c => {
    log('appel entrant');
    c.answer(stream);
    setCall(c);
  });

  function tryCall(){
    if(ok || !peer || peer.destroyed) return;
    status('Appel en cours…');
    log('appel sortant vers ' + other);
    setCall(peer.call(other, stream));
    // si pas connecté après 25 s, on retente
    retryTimer = setTimeout(() => {
      if(!ok){
        log('pas de connexion après 25 s → relance');
        try{ call && call.close(); }catch(e){}
        tryCall();
      }
    }, 25000);
  }

  peer.on('error', e => {
    log('peer error: ' + e.type);
    if(e.type === 'peer-unavailable'){
      status('L\'autre n\'est pas encore là… nouvelle tentative');
      if(role === 'b') setTimeout(tryCall, 3000);
    } else if(e.type === 'unavailable-id'){
      status('Ce code est déjà utilisé avec ce rôle. Changez de code.');
    } else {
      status('Erreur : ' + e.type);
    }
  });
}

function setCall(c){
  call = c;

  c.on('stream', s => {
    log('flux distant reçu');
    const r = $('remote');
    r.srcObject = s;
    r.play().catch(() => {});
    limit(c.peerConnection);
    watchIce(c.peerConnection);

    if(statsTimer) clearInterval(statsTimer);
    statsTimer = setInterval(async () => {
      try{
        const st = await c.peerConnection.getStats();
        let v = 0, a = 0;
        st.forEach(x => {
          if(x.type === 'inbound-rtp'){
            if(x.kind === 'video') v = x.bytesReceived;
            if(x.kind === 'audio') a = x.bytesReceived;
          }
        });
        $('dbg').textContent = 'Reçu de l\'autre : vidéo ' + Math.round(v/1024) + ' Ko, audio ' + Math.round(a/1024) + ' Ko';
      }catch(e){}
    }, 2000);
  });

  c.on('close', () => {
    log('appel fermé');
    status('Appel terminé. Rechargez la page pour rappeler.');
  });
  c.on('error', e => log('call error: ' + e));

  // Le 'stream' peut arriver avant que peerConnection existe : on branche ICE ici aussi
  setTimeout(() => { if(c.peerConnection) watchIce(c.peerConnection); }, 0);
}

let watched = new WeakSet();
function watchIce(pc){
  if(!pc || watched.has(pc)) return;
  watched.add(pc);
  pc.addEventListener('iceconnectionstatechange', () => {
    const st = pc.iceConnectionState;
    log('ICE: ' + st);
    if(st === 'connected' || st === 'completed'){
      ok = true;
      if(retryTimer) clearTimeout(retryTimer);
      status('Connecté ✔ (touchez la vidéo pour activer le son)');
    } else if(st === 'failed'){
      status('Échec réseau (ICE failed). Rechargez et réessayez.');
    } else if(st === 'disconnected'){
      status('Connexion instable…');
    } else {
      status('Réseau : ' + st + ' …');
    }
  });
  pc.addEventListener('icecandidateerror', e => log('ICE ERROR ' + e.errorCode + ' ' + (e.url||'')));
}

// Limite le débit vidéo (connexion faible) : ~40 kbit/s, audio prioritaire
function limit(pc){
  try{
    pc.getSenders().forEach(s => {
      if(s.track && s.track.kind === 'video'){
        const p = s.getParameters();
        if(!p.encodings || !p.encodings.length) p.encodings = [{}];
        p.encodings[0].maxBitrate = 40000;
        p.encodings[0].maxFramerate = 8;
        s.setParameters(p).catch(() => {});
      }
    });
  }catch(e){}
}

function toggleCam(){
  const v = stream.getVideoTracks()[0];
  v.enabled = !v.enabled;
  $('cam').textContent = v.enabled ? 'Couper la vidéo (audio seul)' : 'Remettre la vidéo';
}
</script>
</body>
</html>
