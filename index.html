<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appel léger</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  video{width:100%;max-width:480px;background:#000;border-radius:10px}
  #me{max-width:140px;position:absolute;right:16px;top:16px;opacity:.9}
  #box{position:relative;width:100%;max-width:480px}
  input,button{font-size:16px;padding:10px;border-radius:8px;border:0}
  button{background:#e0457b;color:#fff}
  #s{font-size:14px;opacity:.8;text-align:center}
  #log{font-size:11px;opacity:.6;white-space:pre-wrap;max-width:480px;width:100%;max-height:160px;overflow:auto;background:#000;padding:6px;border-radius:6px}
</style>
</head>
<body>
  <div id="join">
    <input id="code" placeholder="code secret (ex: nous2026)">
    <button onclick="start('a')">Je lance l'appel</button>
    <button onclick="start('b')">Je rejoins</button>
  </div>
  <div id="s">Mettez le même code tous les deux.</div>
  <div id="relay" style="font-size:13px"></div>
  <div id="dbg" style="font-size:12px;opacity:.6"></div>
  <div id="box">
    <video id="remote" autoplay playsinline onclick="this.muted=false;this.play()"></video>
    <video id="me" autoplay playsinline muted></video>
  </div>
  <button id="cam" onclick="toggleCam()" style="display:none">Couper la vidéo (audio seul)</button>
  <div id="log"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let stream, peer, call, ok = false, retryTimer = null;

// ====== À REMPLIR : URL Metered (TURN Server → API key) ======
const TURN_API = 'https://VOTREAPP.metered.live/api/v1/turn/credentials?apiKey=VOTRE_CLE';

// Serveurs de base (toujours présents)
let ICE = [{ urls: 'stun:stun.l.google.com:19302' }];

function status(t){ $('s').textContent = t; }
function log(t){
  const d = new Date().toTimeString().slice(0,8);
  $('log').textContent += d + ' ' + t + '\n';
  $('log').scrollTop = 1e9;
}

async function start(role){
  const code = $('code').value.trim().toLowerCase().replace(/\W/g,'');
  if(code.length < 4) return status('Code trop court (4 caractères min).');

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:160},height:{ideal:120},frameRate:{ideal:8,max:10}},
      audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}
    });
  }catch(e){ return status('Caméra/micro refusés : '+e.message); }
  $('me').srcObject = stream;
  $('join').style.display='none';
  $('cam').style.display='block';

  // 1) Récupère des identifiants TURN frais (jamais expirés)
  status('Chargement du relais…');
  try{
    const r = await fetch(TURN_API, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const list = await r.json();
    ICE = ICE.concat(list);
    log('TURN chargé : ' + list.length + ' serveurs');
  }catch(e){
    log('TURN indisponible : ' + e.message);
    status('Relais indisponible, on tente en direct…');
  }

  // 2) Vérifie qu'on obtient bien un candidat relay
  const good = await testRelay();
  $('relay').textContent = good ? 'Relais : OK ✔' : 'Relais : REFUSÉ ✘ (clé Metered ou réseau)';
  log('testRelay = ' + good);

  connect(code, role);
}

function testRelay(){
  return new Promise(res => {
    let done = false;
    const pc = new RTCPeerConnection({ iceServers: ICE, iceTransportPolicy: 'relay' });
    const fin = v => { if(!done){ done = true; pc.close(); res(v); } };
    pc.onicecandidate = e => {
      if(!e.candidate) return;
      log('cand: ' + e.candidate.candidate.split(' ').slice(4,8).join(' '));
      if(e.candidate.candidate.includes(' typ relay')) fin(true);
    };
    pc.onicecandidateerror = e => log('ICE ERROR ' + e.errorCode + ' ' + e.url);
    pc.createDataChannel('x');
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin(false));
    setTimeout(() => fin(false), 8000);
  });
}

// 3) 'a' attend, 'b' appelle et réessaie tant que ça ne marche pas
function connect(code, role){
  const me = 'call-'+code+'-'+role;
  const other = 'call-'+code+'-'+(role === 'a' ? 'b' : 'a');

  peer = new Peer(me, {
    config: { iceServers: ICE, iceTransportPolicy: 'all', iceCandidatePoolSize: 2 },
    debug: 1
  });

  function tryCall(){
    if(ok || peer.destroyed) return;
    status('Appel en cours…');
    log('j’appelle ' + other);
    setCall(peer.call(other, stream), role, tryCall);
  }

  peer.on('open', id => {
    log('peer open: ' + id);
    if(role === 'a') status('En attente de l’autre personne…');
    else tryCall();
  });
  peer.on('call', c => { log('appel entrant'); c.answer(stream); setCall(c, role, tryCall); });
  peer.on('disconnected', () => { log('signalisation perdue, reconnexion'); if(!peer.destroyed) peer.reconnect(); });
  peer.on('error', e => {
    log('peer error: ' + e.type);
    if(e.type === 'peer-unavailable'){
      status('L’autre n’est pas encore là, nouvel essai…');
      clearTimeout(retryTimer); retryTimer = setTimeout(tryCall, 3000);
    } else if(e.type === 'unavailable-id'){
      status('Ancienne session encore active, nouvel essai…');
      peer.destroy();
      setTimeout(() => connect(code, role), 4000);
    } else status('Erreur : '+e.type);
  });
}

function setCall(c, role, tryCall){
  if(call && call !== c){ try{ call.close(); }catch(e){} }
  call = c;
  ok = false;

  const attach = () => {
    const pc = c.peerConnection;
    if(!pc) return setTimeout(attach, 50);

    pc.addEventListener('icecandidate', e => {
      if(e.candidate) log('local: ' + e.candidate.candidate.split(' ').slice(4,8).join(' '));
    });
    pc.addEventListener('icecandidateerror', e => log('ICE ERROR ' + e.errorCode + ' ' + e.url));
    pc.addEventListener('iceconnectionstatechange', () => {
      const st = pc.iceConnectionState;
      log('ICE: ' + st);
      if(st === 'connected' || st === 'completed'){
        ok = true; status('Connecté ✔');
        showPath(pc);
      } else if(st === 'failed'){
        ok = false;
        status('Échec réseau, nouvelle tentative…');
        // Filet de sécurité : b relance l'appel, a attend
        try{ c.close(); }catch(e){}
        if(role === 'b'){ clearTimeout(retryTimer); retryTimer = setTimeout(tryCall, 2000); }
      } else if(st === 'disconnected'){
        status('Connexion instable…');
      } else status('Réseau : ' + st + ' …');
    });

    // Si bloqué en "checking" > 20 s → on relance plutôt que d'attendre
    setTimeout(() => {
      if(!ok && pc.iceConnectionState === 'checking'){
        log('bloqué en checking → relance');
        try{ c.close(); }catch(e){}
        if(role === 'b'){ clearTimeout(retryTimer); retryTimer = setTimeout(tryCall, 1000); }
      }
    }, 20000);
  };
  attach();

  c.on('stream', s => {
    const r = $('remote');
    r.srcObject = s;
    limit(c.peerConnection);
    r.play().catch(() => {});
    const iv = setInterval(async () => {
      if(!c.peerConnection || c.peerConnection.signalingState === 'closed') return clearInterval(iv);
      try {
        const st = await c.peerConnection.getStats();
        let v = 0, a = 0;
        st.forEach(x => {
          if(x.type === 'inbound-rtp'){
            if(x.kind === 'video') v = x.bytesReceived;
            if(x.kind === 'audio') a = x.bytesReceived;
          }
        });
        $('dbg').textContent = 'Reçu : vidéo ' + Math.round(v/1024) + ' Ko, audio ' + Math.round(a/1024) + ' Ko';
      } catch(e){}
    }, 2000);
  });
  c.on('close', () => { if(ok){ ok = false; status('Appel terminé. Rechargez pour rappeler.'); } });
  c.on('error', e => log('call error: ' + e));
}

// Affiche le chemin réellement utilisé (direct ou relais)
async function showPath(pc){
  try{
    const st = await pc.getStats();
    st.forEach(s => {
      if(s.type === 'candidate-pair' && s.state === 'succeeded' && s.nominated){
        const l = st.get(s.localCandidateId), r = st.get(s.remoteCandidateId);
        log('chemin : ' + (l && l.candidateType) + ' → ' + (r && r.candidateType));
      }
    });
  }catch(e){}
}

function limit(pc){
  pc.getSenders().forEach(s => {
    if(!s.track) return;
    const p = s.getParameters();
    if(!p.encodings || !p.encodings.length) p.encodings = [{}];
    if(s.track.kind === 'video'){ p.encodings[0].maxBitrate = 60000; p.encodings[0].maxFramerate = 10; }
    else { p.encodings[0].maxBitrate = 20000; }
    s.setParameters(p).catch(()=>{});
  });
}

function toggleCam(){
  const v = stream.getVideoTracks()[0];
  v.enabled = !v.enabled;
  $('cam').textContent = v.enabled ? 'Couper la vidéo (audio seul)' : 'Remettre la vidéo';
}
</script>
</body>
</html>
