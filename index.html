<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appel léger</title>
<style>
*{box-sizing:border-box}
:root{--bg:#1b1c20;--panel:#26282d;--line:#34373e;--text:#eceef2;--mute:#9aa0aa;--accent:#5b8cff;--danger:#e5484d}
html,body{margin:0;height:100%}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#3a3d45;color:var(--text)}
button:hover{background:#464a53}
button.primary{background:var(--accent);color:#fff}
button.danger{background:var(--danger);color:#fff}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;outline:none}
.muted{color:var(--mute);font-size:14px}
#status{font-size:14px;color:var(--mute);min-height:20px;text-align:center}
.hidden{display:none !important}

#join{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
#code_out{font-family:monospace;font-size:22px;text-align:center;letter-spacing:2px;padding:10px;background:var(--bg);border-radius:10px}

#call{flex:1;display:none;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;background:#000;overflow:hidden;display:grid;gap:4px;padding:4px;grid-template-columns:1fr;grid-auto-rows:1fr}
.tile{position:relative;background:#111;border-radius:12px;overflow:hidden;min-height:140px;display:flex;align-items:center;justify-content:center}
.tile video{width:100%;height:100%;object-fit:cover}
.tile.off video{display:none}
.avatar{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:none;align-items:center;justify-content:center}
.tile.off .avatar{display:flex}
.label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-size:13px}
#selfTile{position:absolute;right:12px;bottom:12px;width:200px;height:140px;z-index:5;cursor:move;border:2px solid var(--line);touch-action:none}

#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:var(--panel);border-top:1px solid var(--line);position:relative}
#bar button{width:48px;height:48px;padding:0;font-size:20px;border-radius:50%}
#bar button.wide{width:auto;height:48px;border-radius:24px;padding:0 16px;font-size:14px}
#emojiPanel{display:none;position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;flex-wrap:wrap;gap:4px;width:min(320px,90vw);z-index:20}
#emojiPanel button{width:40px;height:40px;font-size:22px;padding:0;border-radius:8px}
#menu{display:none;position:absolute;bottom:70px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;flex-direction:column;gap:4px;z-index:20}
#menu button{text-align:left;width:100%;border-radius:8px;height:auto;border-radius:8px;font-size:14px}
.floatEmoji{position:fixed;pointer-events:none;font-size:40px;animation:fl 2s ease-out forwards;z-index:50}
@keyframes fl{to{transform:translateY(-200px);opacity:0}}

#chatPanel{display:none;position:fixed;right:0;top:0;bottom:0;width:min(320px,100%);background:var(--panel);border-left:1px solid var(--line);flex-direction:column;z-index:30}
#chatLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
#chatForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#chatForm input{padding:8px 10px}
.msg b{color:var(--accent)}
</style>
</head>
<body>

<!-- ACCUEIL -->
<div id="join">
  <div class="card">
    <h1 style="text-align:center;margin:0">Appel léger</h1>
    <input id="name" placeholder="Votre pseudo">
    <button class="primary" onclick="createRoom()">Créer une réunion</button>
    <div id="inviteBox" class="hidden">
      <div class="muted">Code de la réunion :</div>
      <div id="code_out"></div>
      <button onclick="copyCode()">Copier le code</button>
      <button class="primary" onclick="enterCall()">Entrer dans la réunion</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <input id="code" placeholder="Code de la réunion">
    <button onclick="joinRoom()">Rejoindre</button>
    <div id="status"></div>
  </div>
</div>

<!-- APPEL -->
<div id="call">
  <div id="stage">
    <div class="tile" id="remoteTile">
      <video id="remote" autoplay playsinline></video>
      <div class="avatar" id="remoteAvatar"></div>
      <div class="label" id="remoteLabel">En attente…</div>
    </div>
    <div class="tile" id="selfTile">
      <video id="local" autoplay muted playsinline></video>
      <div class="avatar" id="selfAvatar"></div>
      <div class="label" id="selfLabel"></div>
    </div>
  </div>
  <div id="bar">
    <button id="btnMic" title="Micro" onclick="toggleMic()">🎤</button>
    <button id="btnCam" title="Caméra" onclick="toggleCam()">📷</button>
    <button title="Partager l'écran" onclick="toggleScreen()">🖥️</button>
    <button title="Emojis" onclick="toggleEmoji()">😀</button>
    <button title="Chat" onclick="toggleChat()">💬</button>
    <button title="Plein écran" onclick="toggleFull()">⛶</button>
    <button title="Paramètres" onclick="toggleMenu()">⚙️</button>
    <button class="wide danger" onclick="hangup()">Quitter</button>
    <div id="emojiPanel"></div>
    <div id="menu">
      <button onclick="switchDevice('audioinput')">Changer le micro</button>
      <button onclick="switchDevice('videoinput')">Changer la caméra</button>
    </div>
  </div>
</div>

<div id="chatPanel">
  <div style="padding:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
    <b>Chat</b><button onclick="toggleChat()">✕</button>
  </div>
  <div id="chatLog"></div>
  <form id="chatForm" onsubmit="sendChat(event)">
    <input id="chatInput" placeholder="Écrire un message">
    <button class="primary">OK</button>
  </form>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const EMOJIS = ['👍','👏','😂','❤️','😮','😢','🎉','🔥','👀','🙌','😍','🤔','👋','🙏','💯','😎','🥳','🤣','😅','🤩'];

let peer = null, stream = null, screenStream = null;
let roomId = '', myName = '', isHost = false;
let mainCall = null;
let dataConns = [];   // connexions de données (chat, emojis) avec les autres

function status(t){ $('status').textContent = t; }
function initial(n){ return (n || '?').trim().charAt(0).toUpperCase(); }

// ===== Média =====
async function getMedia(){
  if(stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  $('local').srcObject = stream;
  $('selfLabel').textContent = myName + ' (vous)';
  $('selfAvatar').textContent = initial(myName);
  return stream;
}

// ===== Créer : l'hôte ouvre son identifiant et attend =====
async function createRoom(){
  myName = $('name').value.trim();
  if(!myName) return status('Entrez un pseudo.');
  roomId = String(Math.floor(10000 + Math.random() * 90000));
  isHost = true;
  status('Création…');
  try{ await getMedia(); }catch(e){ return status('Caméra/micro refusés : ' + e.message); }
  peer = new Peer('room-' + roomId, { config: { iceServers: ICE } });
  peer.on('open', () => {
    $('code_out').textContent = roomId;
    $('inviteBox').classList.remove('hidden');
    status('Réunion prête. Partagez le code.');
  });
  peer.on('connection', conn => setupDataConn(conn));
  peer.on('call', c => { c.answer(stream); attachMain(c); });
  peer.on('error', e => status('Erreur : ' + e.type));
}

// ===== Rejoindre : l'invité appelle directement l'hôte =====
async function joinRoom(){
  myName = $('name').value.trim();
  roomId = $('code').value.trim().replace(/\s/g,'');
  if(!myName) return status('Entrez un pseudo.');
  if(roomId.length < 4) return status('Code invalide.');
  isHost = false;
  status('Connexion…');
  try{ await getMedia(); }catch(e){ return status('Caméra/micro refusés : ' + e.message); }
  peer = new Peer(undefined, { config: { iceServers: ICE } });
  peer.on('open', () => {
    const conn = peer.connect('room-' + roomId, { reliable: true });
    setupDataConn(conn);
    const c = peer.call('room-' + roomId, stream);
    attachMain(c);
    enterCall();
    status('');
  });
  peer.on('call', c => { c.answer(stream); attachMain(c); });
  peer.on('error', e => {
    if(e.type === 'peer-unavailable') status('Réunion introuvable. Vérifiez le code.');
    else status('Erreur : ' + e.type);
  });
}

// ===== Données (chat, emojis) =====
function setupDataConn(conn){
  dataConns.push(conn);
  conn.on('open', () => {});
  conn.on('data', d => {
    if(d.t === 'chat') addChat(d.name, d.text);
    else if(d.t === 'emoji') floatEmoji(d.emoji);
    // relais : l'hôte retransmet aux autres invités
    if(isHost) dataConns.forEach(c => { if(c !== conn && c.open) c.send(d); });
  });
  conn.on('close', () => { dataConns = dataConns.filter(c => c !== conn); });
}

function sendData(msg){
  dataConns.forEach(c => { if(c.open) c.send(msg); });
}

// ===== Entrer dans la salle =====
function enterCall(){
  $('join').classList.add('hidden');
  $('call').style.display = 'flex';
  buildEmojis();
  if(stream) $('local').srcObject = stream;
}

// ===== Appel vidéo =====
function attachMain(c){
  mainCall = c;
  c.on('stream', s => {
    $('remote').srcObject = s;
    $('remoteLabel').textContent = 'Participant';
    $('remoteAvatar').textContent = '?';
  });
  c.on('close', () => { $('remote').srcObject = null; $('remoteLabel').textContent = 'En attente…'; mainCall = null; });
}

// ===== Contrôles =====
function toggleMic(){
  const t = stream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $('btnMic').textContent = t.enabled ? '🎤' : '🔇';
}

function toggleCam(){
  const t = stream.getVideoTracks()[0];
  t.enabled = !t.enabled;
  $('selfTile').classList.toggle('off', !t.enabled);
  $('selfAvatar').textContent = initial(myName);
  $('btnCam').textContent = t.enabled ? '📷' : '🚫';
}

async function toggleScreen(){
  if(screenStream){
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    replaceVideo(stream.getVideoTracks()[0]);
    $('local').srcObject = stream;
    return;
  }
  try{
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    replaceVideo(screenStream.getVideoTracks()[0]);
    $('local').srcObject = screenStream;
    screenStream.getVideoTracks()[0].onended = () => toggleScreen();
  }catch(e){ status('Partage annulé.'); }
}

function replaceVideo(track){
  if(!mainCall || !mainCall.peerConnection) return;
  const s = mainCall.peerConnection.getSenders().find(x => x.track && x.track.kind === 'video');
  if(s) s.replaceTrack(track);
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function toggleMenu(){
  const m = $('menu');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}

async function switchDevice(kind){
  try{
    const fresh = await navigator.mediaDevices.getUserMedia(
      kind === 'audioinput' ? { audio: true } : { video: true }
    );
    const track = kind === 'audioinput' ? fresh.getAudioTracks()[0] : fresh.getVideoTracks()[0];
    const old = kind === 'audioinput' ? stream.getAudioTracks()[0] : stream.getVideoTracks()[0];
    old.stop();
    stream.removeTrack(old);
    stream.addTrack(track);
    if(kind === 'videoinput') replaceVideo(track);
  }catch(e){ status('Changement impossible : ' + e.message); }
  $('menu').style.display = 'none';
}

function buildEmojis(){
  const p = $('emojiPanel');
  if(p.children.length) return;
  for(const e of EMOJIS){
    const b = document.createElement('button');
    b.textContent = e;
    b.onclick = () => sendEmoji(e);
    p.appendChild(b);
  }
}

function toggleEmoji(){
  const p = $('emojiPanel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
}

function sendEmoji(e){
  floatEmoji(e);
  sendData({ t: 'emoji', emoji: e });
}

function floatEmoji(e){
  const el = document.createElement('div');
  el.className = 'floatEmoji';
  el.textContent = e;
  el.style.left = (30 + Math.random() * 60) + '%';
  el.style.bottom = '90px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== Chat =====
function toggleChat(){
  const c = $('chatPanel');
  c.style.display = c.style.display === 'flex' ? 'none' : 'flex';
}

function sendChat(ev){
  ev.preventDefault();
  const text = $('chatInput').value.trim();
  if(!text) return;
  $('chatInput').value = '';
  addChat(myName, text);
  sendData({ t: 'chat', name: myName, text });
}

function addChat(name, text){
  const d = document.createElement('div');
  d.className = 'msg';
  const b = document.createElement('b');
  b.textContent = name + ' : ';
  d.appendChild(b);
  d.appendChild(document.createTextNode(text));
  $('chatLog').appendChild(d);
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

// ===== Code et sortie =====
function copyCode(){
  navigator.clipboard.writeText(roomId);
  status('Code copié.');
}

function hangup(){
  if(mainCall) mainCall.close();
  if(peer) peer.destroy();
  if(stream) stream.getTracks().forEach(t => t.stop());
  if(screenStream) screenStream.getTracks().forEach(t => t.stop());
  location.href = location.pathname;
}

// ===== Vignette locale déplaçable =====
(function(){
  const self = $('selfTile'), stage = $('stage');
  let drag = false, ox = 0, oy = 0;
  self.onpointerdown = e => {
    drag = true;
    const r = self.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    self.setPointerCapture(e.pointerId);
  };
  self.onpointermove = e => {
    if(!drag) return;
    const s = stage.getBoundingClientRect();
    let x = e.clientX - s.left - ox, y = e.clientY - s.top - oy;
    x = Math.max(0, Math.min(x, s.width - self.offsetWidth));
    y = Math.max(0, Math.min(y, s.height - self.offsetHeight));
    self.style.left = x + 'px'; self.style.top = y + 'px';
    self.style.right = 'auto'; self.style.bottom = 'auto';
  };
  self.onpointerup = () => { drag = false; };
})();
</script>
</body>
</html>
