<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pli Call - Plipli Corp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran de connexion -->
  <section id="login" class="screen active">
    <h1>Pli Call</h1>
    <p class="subtitle">by Plipli Corp</p>
    <input id="pseudo" type="text" placeholder="Ton pseudo" maxlength="20">
    <button id="joinBtn">Rejoindre</button>
  </section>

  <!-- Écran d'appel -->
  <section id="call" class="screen">
    <header>
      <span>Pli Call</span>
      <button id="leaveBtn" class="danger">Quitter</button>
    </header>
    <main id="participants"></main>
    <aside id="chat">
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" placeholder="Écrire un message...">
        <button type="submit">Envoyer</button>
      </form>
    </aside>
  </section>

  <script src="script.js"></script>
</body>
</html>
