<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appel léger</title>
<style>
*{box-sizing:border-box}
:root{--bg:#1b1c20;--panel:#26282d;--line:#34373e;--text:#eceef2;--mute:#9aa0aa;--accent:#5b8cff;--danger:#e5484d;--ok:#3fb950}
html,body{margin:0;height:100%}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#3a3d45;color:var(--text)}
button:hover{background:#464a53}
button.primary{background:var(--accent);color:#fff}
button.danger{background:var(--danger);color:#fff}
button.ok{background:var(--ok);color:#fff}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;outline:none}
input:focus{border-color:var(--accent)}
#join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
#join h1{margin:0;font-size:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;width:min(92vw,380px)}
.muted{color:var(--mute);font-size:13px;text-align:center}
#inviteBox{display:none;flex-direction:column;gap:8px}
#link{word-break:break-all;font-size:12px;color:var(--accent);background:var(--bg);border-radius:8px;padding:8px}
#status{font-size:13px;color:var(--mute);text-align:center;min-height:18px}
#room{display:none;flex:1;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;background:#000;overflow:hidden;min-height:0}
#remote{width:100%;height:100%;object-fit:contain;background:#000}
#self{position:absolute;width:180px;height:135px;right:14px;bottom:14px;background:#111;border-radius:12px;overflow:hidden;border:2px solid var(--line);cursor:grab;touch-action:none;z-index:5}
#self video{width:100%;height:100%;object-fit:cover}
#self .name{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;font-size:12px}
#self.off video{display:none}
#self.off .avatar{display:flex}
.avatar{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:34px;font-weight:600;background:#2d3340}
#bar{height:76px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#bar button{min-width:52px;height:52px;border-radius:50%;padding:0;font-size:20px}
#bar button.hang{border-radius:26px;width:auto;padding:0 20px;background:var(--danger);color:#fff}
#emojis{display:none;position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;gap:4px;flex-wrap:wrap;width:260px;z-index:20}
#emojis.open{display:flex}
#emojis button{width:44px;height:44px;font-size:22px;padding:0;border-radius:10px;background:transparent}
#emojis button:hover{background:#3a3d45}
.float{position:absolute;bottom:90px;font-size:36px;pointer-events:none;animation:up 2.3s ease-out forwards;z-index:30}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
#chat{position:absolute;top:0;right:0;bottom:0;width:min(88vw,300px);background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:40}
#chat.open{display:flex}
#chatHead{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{background:#2f3239;border-radius:10px;padding:8px 10px;font-size:14px;word-wrap:break-word}
.msg.me{background:var(--accent);color:#fff}
.msg .who{font-size:11px;opacity:.7;margin-bottom:2px}
#chatForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#chatForm button{padding:10px 14px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(92vw,340px)}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast .acts{display:flex;gap:8px;margin-top:8px}
.toast .acts button{flex:1;padding:8px}
@media (max-width:600px){
  #self{width:110px;height:82px}
  #bar button{min-width:44px;height:44px;font-size:18px}
  #bar button.hang{padding:0 14px}
}
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1 style="text-align:center;margin:0">Appel léger</h1>
    <input id="name" placeholder="Votre pseudo">
    <button class="primary" onclick="createRoom()">Créer une réunion</button>
    <div id="inviteBox">
      <div class="muted">Partagez ce lien :</div>
      <div id="link"></div>
      <button onclick="copyLink()">Copier le lien</button>
    </div>
    <div class="muted">ou rejoindre avec un lien reçu :</div>
    <input id="code" placeholder="Code de la réunion">
    <button onclick="requestJoin()">Demander à rejoindre</button>
    <div id="status"></div>
  </div>
</div>

<div id="room">
  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <div id="self">
      <video id="me" autoplay muted playsinline></video>
      <div class="avatar" id="avatar"></div>
      <div class="name" id="selfName"></div>
    </div>
    <div id="emojis"></div>
    <div id="chat">
      <div id="chatHead"><b>Chat</b><button onclick="toggleChat()">X</button></div>
      <div id="msgs"></div>
      <form id="chatForm" onsubmit="sendChat(event)">
        <input id="chatIn" placeholder="Message">
        <button class="primary" type="submit">Envoyer</button>
      </form>
    </div>
  </div>
  <div id="bar">
    <button id="bMic" onclick="toggleMic()" title="Micro">M</button>
    <button id="bCam" onclick="toggleCam()" title="Caméra">C</button>
    <button onclick="toggleScreen()" title="Partage d'écran">E</button>
    <button onclick="toggleEmojis()" title="Émojis">:)</button>
    <button onclick="toggleChat()" title="Chat">Chat</button>
    <button onclick="togglePiP()" title="Picture in picture">PiP</button>
    <button onclick="toggleFull()" title="Plein écran">Full</button>
    <button class="hang" onclick="hangup()">Quitter</button>
  </div>
</div>

<div id="toasts"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };

// Relais TURN Metered (identifiants à régénérer si tu les as partagés)
var ICE = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:global.relay.metered.ca:80', username: '403d8a7db25a819098d7d8c9', credential: 'go7c76Oi2qYbDGN1' },
  { urls: 'turn:global.relay.metered.ca:80?transport=tcp', username: '403d8a7db25a819098d7d8c9', credential: 'go7c76Oi2qYbDGN1' },
  { urls: 'turn:global.relay.metered.ca:443', username: '403d8a7db25a819098d7d8c9', credential: 'go7c76Oi2qYbDGN1' },
  { urls: 'turns:global.relay.metered.ca:443?transport=tcp', username: '403d8a7db25a819098d7d8c9', credential: 'go7c76Oi2qYbDGN1' }
];

var EMOJIS = ['👍','👏','😂','😮','❤️','🎉','🙏','🔥'];

var stream = null, screenStream = null, peer = null, call = null, conn = null;
var myName = '', isHost = false, roomId = '';
var pending = new Map();
var micOn = true, camOn = true;

var params = new URLSearchParams(location.search);
if(params.get('room')) $('code').value = params.get('room');

function status(t){ $('status').textContent = t; }

function escapeText(s){
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function roomOf(s){ return String(s).trim().toLowerCase().replace(/[^a-z0-9]/g, ''); }

async function getMedia(){
  stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 10, max: 12 } },
    audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
  });
  $('me').srcObject = stream;
}

function showRoom(){
  $('join').style.display = 'none';
  $('room').style.display = 'flex';
  $('selfName').textContent = myName;
  $('avatar').textContent = myName.charAt(0).toUpperCase();
  enableDrag();
}

// ===== Hôte =====
async function createRoom(){
  myName = $('name').value.trim();
  if(!myName){ status('Entrez un pseudo.'); return; }
  roomId = Math.random().toString(36).slice(2,8);
  isHost = true;
  $('link').textContent = location.origin + location.pathname + '?room=' + roomId;
  $('inviteBox').style.display = 'flex';
  status('Préparation...');
  try { await getMedia(); } catch(e){ status('Caméra/micro refusés : ' + e.message); return; }
  peer = new Peer('room-' + roomId, { config: { iceServers: ICE } });
  peer.on('open', function(){ status('Réunion créée. En attente...'); showRoom(); });
  peer.on('connection', function(c){
    c.on('data', function(d){ if(d.t === 'join') showJoinRequest(c, d.name); });
  });
  peer.on('call', function(c){ c.answer(stream); setCall(c); });
  peer.on('error', function(e){ status('Erreur : ' + e.type); });
}

function copyLink(){
  navigator.clipboard.writeText($('link').textContent);
  status('Lien copié.');
}

function showJoinRequest(c, name){
  var id = 'j' + Date.now() + Math.floor(Math.random() * 1000);
  pending.set(id, { conn: c, name: name });
  var t = document.createElement('div');
  t.className = 'toast';
  t.id = id;
  var b = document.createElement('b');
  b.textContent = name;
  t.appendChild(b);
  t.appendChild(document.createTextNode(' veut rejoindre la réunion'));
  var acts = document.createElement('div');
  acts.className = 'acts';
  var ok = document.createElement('button');
  ok.className = 'ok';
  ok.textContent = 'Accepter';
  ok.onclick = function(){ respond(id, true); };
  var no = document.createElement('button');
  no.className = 'danger';
  no.textContent = 'Refuser';
  no.onclick = function(){ respond(id, false); };
  acts.appendChild(ok);
  acts.appendChild(no);
  t.appendChild(acts);
  $('toasts').appendChild(t);
}

function respond(id, accept){
  var p = pending.get(id);
  if(!p) return;
  pending.delete(id);
  var el = $(id);
  if(el) el.remove();
  if(accept){
    p.conn.send({ t: 'accepted' });
    conn = p.conn;
    conn.on('data', handleData);
    var c = peer.call(p.conn.peer, stream);
    setCall(c);
  } else {
    p.conn.send({ t: 'refused' });
    setTimeout(function(){ p.conn.close(); }, 300);
  }
}

// ===== Invité =====
async function requestJoin(){
  myName = $('name').value.trim();
  roomId = roomOf($('code').value);
  if(!myName){ status('Entrez un pseudo.'); return; }
  if(roomId.length < 4){ status('Code invalide.'); return; }
  status('Connexion...');
  try { await getMedia(); } catch(e){ status('Caméra/micro refusés : ' + e.message); return; }
  peer = new Peer({ config: { iceServers: ICE } });
  peer.on('open', function(){
    conn = peer.connect('room-' + roomId, { reliable: true });
    conn.on('open', function(){
      status('Demande envoyée, en attente de l\'hôte...');
      conn.send({ t: 'join', name: myName });
    });
    conn.on('data', handleData);
    conn.on('close', function(){ status('L\'hôte a fermé la réunion.'); });
  });
  peer.on('call', function(c){ c.answer(stream); setCall(c); });
  peer.on('error', function(e){ status('Erreur : ' + e.type); });
}

function handleData(d){
  if(d.t === 'accepted'){ status('Acceptée, connexion...'); showRoom(); }
  else if(d.t === 'refused'){ alert('L\'hôte a refusé votre demande.'); location.href = location.pathname; }
  else if(d.t === 'chat'){ addMsg(d.name, d.v, false); }
  else if(d.t === 'emoji'){ showFloat(d.v); }
}

// ===== Appel vidéo =====
function setCall(c){
  call = c;
  c.on('stream', function(s){
    $('remote').srcObject = s;
    $('remote').play().catch(function(){});
    status('Connecté');
  });
  c.on('close', function(){ status('Appel terminé.'); });
  setTimeout(function(){
    try {
      c.peerConnection.getSenders().forEach(function(snd){
        if(snd.track && snd.track.kind === 'video'){
          var p = snd.getParameters();
          if(!p.encodings || !p.encodings.length) p.encodings = [{}];
          p.encodings[0].maxBitrate = 60000;
          p.encodings[0].maxFramerate = 10;
          snd.setParameters(p).catch(function(){});
        }
      });
    } catch(e){}
  }, 800);
}

function send(obj){ if(conn && conn.open) conn.send(obj); }

// ===== Commandes =====
function toggleMic(){
  micOn = !micOn;
  if(stream) stream.getAudioTracks().forEach(function(t){ t.enabled = micOn; });
  $('bMic').textContent = micOn ? 'M' : 'X';
}

function toggleCam(){
  camOn = !camOn;
  if(stream) stream.getVideoTracks().forEach(function(t){ t.enabled = camOn; });
  $('self').classList.toggle('off', !camOn);
  $('bCam').textContent = camOn ? 'C' : 'X';
}

async function toggleScreen(){
  var sender = call && call.peerConnection.getSenders().find(function(s){ return s.track && s.track.kind === 'video'; });
  if(screenStream){
    screenStream.getTracks().forEach(function(t){ t.stop(); });
    screenStream = null;
    var cam = stream && stream.getVideoTracks()[0];
    if(sender && cam) sender.replaceTrack(cam);
    status('Partage arrêté.');
    return;
  }
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    var track = screenStream.getVideoTracks()[0];
    if(sender) sender.replaceTrack(track);
    track.onended = function(){
      screenStream = null;
      var cam2 = stream && stream.getVideoTracks()[0];
      if(sender && cam2) sender.replaceTrack(cam2);
    };
  } catch(e){ status('Partage annulé.'); }
}

function toggleEmojis(){
  var box = $('emojis');
  if(!box.childElementCount){
    EMOJIS.forEach(function(e){
      var b = document.createElement('button');
      b.textContent = e;
      b.onclick = function(){ sendEmoji(e); };
      box.appendChild(b);
    });
  }
  box.classList.toggle('open');
}

function sendEmoji(e){
  send({ t: 'emoji', v: e });
  showFloat(e);
}

function showFloat(e){
  var f = document.createElement('div');
  f.className = 'float';
  f.textContent = e;
  f.style.left = (20 + Math.random() * 60) + '%';
  $('stage').appendChild(f);
  setTimeout(function(){ f.remove(); }, 2300);
}

function toggleChat(){ $('chat').classList.toggle('open'); }

function sendChat(e){
  e.preventDefault();
  var v = $('chatIn').value.trim();
  if(!v) return;
  addMsg(myName, v, true);
  send({ t: 'chat', name: myName, v: v });
  $('chatIn').value = '';
}

function addMsg(name, text, me){
  var d = document.createElement('div');
  d.className = 'msg' + (me ? ' me' : '');
  var w = document.createElement('div');
  w.className = 'who';
  w.textContent = me ? 'Vous' : name;
  d.appendChild(w);
  d.appendChild(document.createTextNode(text));
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

async function togglePiP(){
  try {
    if(document.pictureInPictureElement) await document.exitPictureInPicture();
    else await $('remote').requestPictureInPicture();
  } catch(e){ status('Picture-in-picture indisponible.'); }
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
  else document.exitFullscreen();
}

// Caméra locale déplaçable (souris + tactile)
function enableDrag(){
  var self = $('self'), stage = $('stage');
  var dragging = false, offX = 0, offY = 0;
  self.onpointerdown = function(e){
    dragging = true;
    var r = self.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    self.setPointerCapture(e.pointerId);
  };
  self.onpointermove = function(e){
    if(!dragging) return;
    var s = stage.getBoundingClientRect();
    var x = e.clientX - s.left - offX;
    var y = e.clientY - s.top - offY;
    x = Math.max(0, Math.min(x, s.width - self.offsetWidth));
    y = Math.max(0, Math.min(y, s.height - self.offsetHeight));
    self.style.left = x + 'px';
    self.style.top = y + 'px';
    self.style.right = 'auto';
    self.style.bottom = 'auto';
  };
  self.onpointerup = function(){ dragging = false; };
}

function hangup(){
  if(call) call.close();
  if(peer) peer.destroy();
  if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
  if(screenStream) screenStream.getTracks().forEach(function(t){ t.stop(); });
  location.href = location.pathname;
}
</script>
</body>
</html>
