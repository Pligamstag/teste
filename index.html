<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appel vidéo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  #s { font-size: 14px; opacity: .85; text-align: center; padding: 0 12px; min-height: 1.2em; }
  #relay, #dbg { font-size: 12px; opacity: .6; text-align: center; padding: 4px; }

  #join {
    display: flex; flex-direction: column; gap: 10px;
    width: min(92vw, 380px); margin-top: 24px;
  }
  input {
    padding: 14px; font-size: 16px; border-radius: 10px;
    border: 1px solid #333; background: #222; color: #fff;
  }
  button {
    padding: 14px; font-size: 16px; border: 0; border-radius: 10px;
    background: #e0457b; color: #fff; cursor: pointer;
  }
  button.secondary { background: #333; }
  button:disabled { opacity: .5; }

  #cam { display: none; width: 100%; max-width: 900px; margin-top: 12px; }
  #box {
    display: grid; gap: 8px; width: 100%; padding: 8px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 700px) { #box { grid-template-columns: 1fr 1fr; } }
  video {
    width: 100%; aspect-ratio: 4 / 3; background: #000;
    border-radius: 12px; object-fit: cover;
  }
  #controls { display: flex; gap: 8px; margin: 8px 0 16px; flex-wrap: wrap; justify-content: center; }
  #controls button { width: auto; padding: 12px 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Appel vidéo</h1>

<div id="join">
  <input id="code" placeholder="Code secret (4 caractères min, ex : nous2026)" autocomplete="off">
  <button id="btnCreate" onclick="start('a')">Je lance l'appel</button>
  <button id="btnJoin" class="secondary" onclick="start('b')">Je rejoins</button>
</div>

<div id="s">Mettez le même code tous les deux.</div>
<div id="relay"></div>
<div id="dbg"></div>

<div id="cam">
  <div id="box">
    <video id="me" autoplay playsinline muted></video>
    <video id="remote" autoplay playsinline></video>
  </div>
  <div id="controls">
    <button id="btnCam" class="secondary" onclick="toggleCam()">Couper la vidéo (audio seul)</button>
    <button id="btnMute" class="secondary" onclick="toggleMic()">Couper le micro</button>
    <button onclick="leave()">Quitter</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);

// ===== Serveurs de relais (Metered, identifiants intégrés) =====
const TURN_SERVERS = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  {
    urls: [
      'turn:global.relay.metered.ca:80',
      'turn:global.relay.metered.ca:80?transport=tcp',
      'turn:global.relay.metered.ca:443',
      'turns:global.relay.metered.ca:443?transport=tcp'
    ],
    username: '403d8a7db25a819098d7d8c9',
    credential: 'go7c76Oi2qYbDGN1'
  }
];

let stream = null, peer = null, call = null, connected = false;
let myRole = null, myCode = null, retryTimer = null;

function status(t){ $('s').textContent = t; }

// Affiche de gros messages clairs pour une personne qui a un réseau faible
function explain(t){ status(t); $('dbg').textContent = ''; }

// ===== Démarrage =====
async function start(role){
  const code = $('code').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(code.length < 4) return status('Code trop court (4 caractères minimum).');

  $('btnCreate').disabled = $('btnJoin').disabled = true;
  status('Demande d’accès à la caméra et au micro…');

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:320}, height:{ideal:240}, frameRate:{ideal:12,max:15} },
      audio: { echoCancellation:true, noiseSuppression:true, channelCount:1 }
    });
  }catch(e){
    $('btnCreate').disabled = $('btnJoin').disabled = false;
    return status('Caméra ou micro refusés : ' + e.message);
  }

  $('me').srcObject = stream;
  $('join').classList.add('hidden');
  $('cam').style.display = 'block';

  myRole = role;
  myCode = code;
  $('relay').textContent = 'Vérification du relais…';
  const good = await testRelay();
  $('relay').textContent = good ? 'Relais : OK ✔' : 'Relais : indisponible (la connexion peut être plus lente)';

  connect();
}

// ===== Test du relais TURN =====
function testRelay(){
  return new Promise(res => {
    let done = false;
    const pc = new RTCPeerConnection({ iceServers: TURN_SERVERS, iceTransportPolicy: 'relay' });
    const fin = v => { if(!done){ done = true; pc.close(); res(v); } };
    pc.onicecandidate = e => {
      if(e.candidate && e.candidate.candidate.includes(' typ relay')) fin(true);
    };
    pc.createDataChannel('x');
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin(false));
    setTimeout(() => fin(false), 8000);
  });
}

// ===== Connexion PeerJS =====
function connect(){
  const me = 'call-' + myCode + '-' + myRole;
  const other = 'call-' + myCode + '-' + (myRole === 'a' ? 'b' : 'a');

  peer = new Peer(me, {
    config: { iceServers: TURN_SERVERS, iceTransportPolicy: 'all', bundlePolicy: 'max-bundle' }
  });

  function tryCall(){
    if(connected || !peer || peer.destroyed) return;
    status('Appel en cours…');
    setCall(peer.call(other, stream));
  }

  peer.on('open', () => {
    if(myRole === 'a') status('En attente de l’autre personne…');
    else tryCall();
  });

  peer.on('call', c => { c.answer(stream); setCall(c); });

  peer.on('disconnected', () => { if(peer && !peer.destroyed) peer.reconnect(); });

  peer.on('error', e => {
    if(e.type === 'peer-unavailable'){
      status('L’autre n’est pas encore là, nouvel essai dans 3 s…');
      clearTimeout(retryTimer);
      retryTimer = setTimeout(tryCall, 3000);
    } else if(e.type === 'unavailable-id'){
      status('Ancienne session encore active, nouvel essai…');
      peer.destroy();
      setTimeout(connect, 4000);
    } else {
      status('Erreur de connexion (' + e.type + '). Rechargez la page.');
    }
  });
}

// ===== Appel =====
function setCall(c){
  call = c;

  // Suivi réel de l'état réseau (ICE), et non de la simple négociation
  setTimeout(() => {
    try {
      const pc = c.peerConnection;
      pc.addEventListener('iceconnectionstatechange', () => {
        const st = pc.iceConnectionState;
        if(st === 'connected' || st === 'completed'){
          connected = true;
          status('Connecté ✔');
        } else if(st === 'checking'){
          status('Recherche du meilleur chemin réseau…');
        } else if(st === 'disconnected'){
          status('Connexion instable, rétablissement en cours…');
        } else if(st === 'failed'){
          connected = false;
          status('Connexion impossible. Vérifiez votre réseau puis rechargez.');
        }
      });
    } catch(e){}
  }, 0);

  c.on('stream', s => {
    const r = $('remote');
    r.srcObject = s;
    limit(c.peerConnection);
    r.play().catch(() => {});
    startStats(c);
  });

  c.on('close', () => {
    connected = false;
    status('Appel terminé. Rechargez la page pour rappeler.');
  });
}

// Affiche la quantité de données reçues (pour savoir si le flux arrive)
function startStats(c){
  setInterval(async () => {
    try {
      const st = await c.peerConnection.getStats();
      let v = 0, a = 0;
      st.forEach(x => {
        if(x.type === 'inbound-rtp'){
          if(x.kind === 'video') v = x.bytesReceived;
          if(x.kind === 'audio') a = x.bytesReceived;
        }
      });
      $('dbg').textContent = 'Reçu : vidéo ' + Math.round(v/1024) + ' Ko · audio ' + Math.round(a/1024) + ' Ko';
    } catch(e){}
  }, 2000);
}

// Limite le débit pour les connexions faibles : vidéo ~60 kbit/s, audio ~20 kbit/s
function limit(pc){
  pc.getSenders().forEach(s => {
    if(!s.track) return;
    const p = s.getParameters();
    if(!p.encodings || !p.encodings.length) p.encodings = [{}];
    if(s.track.kind === 'video'){
      p.encodings[0].maxBitrate = 60000;
      p.encodings[0].maxFramerate = 10;
    } else {
      p.encodings[0].maxBitrate = 20000;
    }
    s.setParameters(p).catch(()=>{});
  });
}

// ===== Commandes =====
function toggleCam(){
  if(!stream) return;
  const v = stream.getVideoTracks()[0];
  if(!v) return;
  v.enabled = !v.enabled;
  $('btnCam').textContent = v.enabled ? 'Couper la vidéo (audio seul)' : 'Remettre la vidéo';
}

function toggleMic(){
  if(!stream) return;
  const a = stream.getAudioTracks()[0];
  if(!a) return;
  a.enabled = !a.enabled;
  $('btnMute').textContent = a.enabled ? 'Couper le micro' : 'Remettre le micro';
}

function leave(){
  if(call) call.close();
  if(peer) peer.destroy();
  if(stream) stream.getTracks().forEach(t => t.stop());
  location.reload();
}
</script>
</body>
</html>
