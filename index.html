<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <title>Pli Call</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <!-- ================= ÉCRAN D'ACCUEIL ================= -->
  <div id="join">
    <div class="join-card">
      <div class="brand">
        <div class="brand-logo">P</div>
        <div>
          <h1>Pli Call</h1>
          <p class="muted">Visioconférence légère</p>
        </div>
      </div>

      <label class="field">
        <span class="muted">Votre pseudo</span>
        <input id="name" placeholder="Ex : Alex" autocomplete="off">
      </label>

      <button class="btn primary" onclick="createRoom()">
        <span>➕</span> Créer une réunion
      </button>

      <div id="inviteBox" class="hidden">
        <div class="muted" style="margin-top:8px">Code de la réunion :</div>
        <div id="code_out"></div>
        <div class="row">
          <button class="btn" onclick="copyCode()">📋 Copier</button>
          <button class="btn primary" onclick="enterCall()">Rejoindre</button>
        </div>
        <div id="copyHint" class="muted hidden">✓ Code copié</div>
      </div>

      <div class="divider"><span>ou</span></div>

      <label class="field">
        <span class="muted">Code de la réunion</span>
        <input id="code" placeholder="Ex : AB12CD" autocomplete="off">
      </label>

      <button class="btn" onclick="joinRoom()">
        <span>🔗</span> Rejoindre une réunion
      </button>

      <div id="status" class="muted"></div>

      <a href="#" class="muted" style="text-align:center" onclick="showDiag(); return false;">🛠️ Diagnostic de connexion</a>

      <div class="quality-hint">
        <b>Mode basse connexion activé</b><br>
        <span class="muted">Audio prioritaire, vidéo allégée automatiquement.</span>
      </div>
    </div>
  </div>

  <!-- ================= ÉCRAN D'APPEL ================= -->
  <div id="call">

    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left">
        <div class="logo-mini">P</div>
        <div>
          <div class="title">Pli Call</div>
          <div class="muted" id="roomLabel">—</div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="netBadge" class="net-badge">
          <span class="dot"></span> Connexion
        </div>
        <div id="clock" class="muted"></div>
      </div>
    </header>

    <!-- Zone vidéo -->
    <main id="stage">
      <div class="tile" id="remoteTile">
        <video id="remote" autoplay playsinline></video>
        <div class="avatar" id="remoteAvatar">?</div>
        <div class="label" id="remoteLabel">En attente…</div>
        <div class="quality-tag" id="remoteQuality"></div>
      </div>
      <div class="tile" id="selfTile">
        <video id="local" autoplay muted playsinline></video>
        <div class="avatar" id="selfAvatar">?</div>
        <div class="label" id="selfLabel">Moi</div>
        <div class="quality-tag" id="selfQuality"></div>
      </div>
    </main>

    <!-- Barre de contrôles flottante -->
    <div id="bar">
      <button id="btnMic" class="ctrl" title="Micro (M)" onclick="toggleMic()">
        <span class="ico">🎤</span><span class="lbl">Micro</span>
      </button>
      <button id="btnCam" class="ctrl" title="Caméra (V)" onclick="toggleCam()">
        <span class="ico">📷</span><span class="lbl">Caméra</span>
      </button>
      <button id="btnScreen" class="ctrl" title="Partager l'écran" onclick="toggleScreen()">
        <span class="ico">🖥️</span><span class="lbl">Écran</span>
      </button>
      <button class="ctrl" title="Emoji" onclick="toggleEmoji()">
        <span class="ico">😀</span><span class="lbl">Réaction</span>
      </button>
      <button class="ctrl" title="Chat" onclick="toggleChat()">
        <span class="ico">💬</span><span class="lbl">Chat</span>
      </button>
      <button id="btnFull" class="ctrl" title="Plein écran" onclick="toggleFull()">
        <span class="ico">⛶</span><span class="lbl">Plein écran</span>
      </button>
      <button class="ctrl" title="Paramètres" onclick="toggleMenu()">
        <span class="ico">⚙️</span><span class="lbl">Options</span>
      </button>
      <button class="ctrl danger" title="Quitter" onclick="hangup()">
        <span class="ico">✕</span><span class="lbl">Quitter</span>
      </button>

      <div id="emojiPanel"></div>
      <div id="menu">
        <button id="btnFlip" class="hidden" onclick="flipCamera()">🔄 Caméra avant / arrière</button>
        <button id="btnPickMic" onclick="switchDevice('audioinput')">🎙️ Changer le micro</button>
        <button id="btnPickCam" onclick="switchDevice('videoinput')">📷 Changer la caméra</button>
        <button onclick="showDiag()">🛠️ Diagnostic (copier)</button>
        <button onclick="toggleDataSaver()">📶 <span id="dsLabel">Mode basse connexion : ON</span></button>
      </div>
    </div>

    <!-- Sidebar chat -->
    <aside id="chatPanel">
      <div class="chat-head">
        <b>Chat</b>
        <button class="icon-btn" onclick="toggleChat()">✕</button>
      </div>
      <div id="chatLog"></div>
      <form id="chatForm" onsubmit="sendChat(event)">
        <input id="chatInput" placeholder="Écrire un message…" autocomplete="off">
        <button class="btn primary">Envoyer</button>
      </form>
    </aside>

  </div>

  <!-- PeerJS hébergé avec le site (évite qu'un filtre réseau bloque le CDN), avec CDN en secours -->
  <script src="peerjs.min.js?v=7"></script>
  <script>if (typeof Peer === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
  <script>if (typeof Peer === 'undefined') document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>
  <script src="script.js?v=10"></script>
</body>
</html>
