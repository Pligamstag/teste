<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Appel léger</title>
<style>
*{box-sizing:border-box}
:root{--bg:#1b1c20;--panel:#26282d;--line:#34373e;--text:#eceef2;--mute:#9aa0aa;--accent:#5b8cff;--danger:#e5484d}
html,body{margin:0;height:100%}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#3a3d45;color:var(--text)}
button:hover{background:#464a53}
button.primary{background:var(--accent);color:#fff}
button.danger{background:var(--danger);color:#fff}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;outline:none}
#join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.muted{color:var(--mute);font-size:14px}
#status{font-size:14px;color:var(--mute);min-height:20px;text-align:center}
#call{flex:1;display:none;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;background:#000;overflow:hidden}
#remote{width:100%;height:100%;object-fit:contain;background:#000}
#self{position:absolute;right:16px;bottom:16px;width:min(28vw,240px);aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000;cursor:move;touch-action:none}
#self video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#self .label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px;font-size:12px}
#avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#2c2f36;font-size:40px;font-weight:700}
#bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px;background:var(--panel);border-top:1px solid var(--line)}
#bar button{width:52px;height:52px;border-radius:50%;padding:0;font-size:22px}
#bar button.wide{width:auto;border-radius:26px;padding:0 18px;font-size:14px}
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1 style="text-align:center;margin:0">Appel léger</h1>
    <input id="name" placeholder="Votre pseudo">
    <button class="primary" onclick="createRoom()">Créer une réunion</button>
    <div id="inviteBox" style="display:none">
      <div class="muted">Partagez ce lien :</div>
      <div id="link" style="word-break:break-all;font-size:13px"></div>
      <button onclick="copyLink()">Copier le lien</button>
    </div>
    <div class="muted">ou rejoindre avec un code :</div>
    <input id="code" placeholder="Code de la réunion">
    <button onclick="joinRoom()">Rejoindre</button>
    <div id="status"></div>
  </div>
</div>

<div id="call">
  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <div id="self">
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="avatar"></div>
      <div class="label" id="selfName"></div>
    </div>
  </div>
  <div id="bar">
    <button id="bMic" onclick="toggleMic()" title="Micro">🎤</button>
    <button id="bCam" onclick="toggleCam()" title="Caméra">📷</button>
    <button id="bScreen" onclick="toggleScreen()" title="Partager l'écran">🖥️</button>
    <button onclick="toggleFull()" title="Plein écran">⛶</button>
    <button onclick="sendEmoji('😀')" title="Emoji">😀</button>
    <button onclick="sendEmoji('👍')" title="Emoji">👍</button>
    <button class="danger" onclick="hangup()" title="Quitter">📞</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ICE = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:TON_SERVEUR.metered.live:80', username: 'TON_USER', credential: 'TON_MDP' },
  { urls: 'turn:TON_SERVEUR.metered.live:443?transport=tcp', username: 'TON_USER', credential: 'TON_MDP' }
];

let peer, call, conn, stream, screenStream, roomId, myName, isHost = false;
const peersName = {};

function status(t){ $('status').textContent = t; }
function roomOf(code){ return code.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); }
function randomCode(){ return Math.random().toString(36).slice(2, 8); }

async function getMedia(){
  stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { max: 20 } },
    audio: true
  });
  $('localVideo').srcObject = stream;
  $('selfName').textContent = myName;
}

function showCall(){
  $('join').style.display = 'none';
  $('call').style.display = 'flex';
}

// ===== Hôte =====
async function createRoom(){
  myName = $('name').value.trim();
  if(!myName) return status('Entrez un pseudo.');
  isHost = true;
  roomId = randomCode();
  status('Création…');
  try{ await getMedia(); }catch(e){ return status('Caméra/micro refusés : ' + e.message); }
  peer = new Peer('room-' + roomId, { config: { iceServers: ICE } });
  peer.on('open', () => {
    $('link').textContent = location.href.split('?')[0] + '?r=' + roomId;
    $('inviteBox').style.display = 'flex';
    status('Réunion créée. Partagez le code : ' + roomId);
  });
  peer.on('call', c => answer(c));
  peer.on('error', e => status('Erreur : ' + e.type));
  showCall();
}

// ===== Invité =====
async function joinRoom(){
  myName = $('name').value.trim();
  roomId = roomOf($('code').value);
  if(!myName) return status('Entrez un pseudo.');
  if(roomId.length < 4) return status('Code invalide.');
  status('Connexion…');
  try{ await getMedia(); }catch(e){ return status('Caméra/micro refusés : ' + e.message); }
  peer = new Peer({ config: { iceServers: ICE } });
  peer.on('open', () => tryCall());
  peer.on('call', c => answer(c));
  peer.on('error', e => status('Erreur : ' + e.type));
  showCall();
}

function tryCall(){
  if(call && call.open) return;
  const c = peer.call('room-' + roomId, stream);
  if(!c){ return setTimeout(tryCall, 3000); }
  c.on('stream', s => attach(s));
  c.on('close', () => { call = null; });
  call = c;
  setTimeout(() => { if(!call || !call.open) tryCall(); }, 3000);
}

function answer(c){
  call = c;
  c.answer(stream);
  c.on('stream', s => attach(s));
}

function attach(s){
  $('remote').srcObject = s;
  $('remote').play().catch(() => {});
  status('');
}

// ===== Contrôles =====
function toggleMic(){
  const t = stream.getAudioTracks()[0];
  t.enabled = !t.enabled;
  $('bMic').textContent = t.enabled ? '🎤' : '🔇';
}

function toggleCam(){
  const t = stream.getVideoTracks()[0];
  t.enabled = !t.enabled;
  $('bCam').textContent = t.enabled ? '📷' : '🚫';
  $('avatar').style.display = t.enabled ? 'none' : 'flex';
  $('avatar').textContent = myName.charAt(0).toUpperCase();
}

async function toggleScreen(){
  if(screenStream){
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    const cam = stream.getVideoTracks()[0];
    const sender = call && call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
    if(sender) sender.replaceTrack(cam);
    return status('Partage arrêté.');
  }
  try{
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track = screenStream.getVideoTracks()[0];
    const sender = call && call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
    if(sender) sender.replaceTrack(track);
    track.onended = () => { screenStream = null; };
  }catch(e){ status('Partage annulé.'); }
}

function sendEmoji(e){
  status(e);
  setTimeout(() => status(''), 2000);
}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

function copyLink(){
  navigator.clipboard.writeText($('link').textContent);
  status('Lien copié.');
}

function hangup(){
  if(call) call.close();
  if(peer) peer.destroy();
  if(stream) stream.getTracks().forEach(t => t.stop());
  if(screenStream) screenStream.getTracks().forEach(t => t.stop());
  location.href = location.pathname;
}

// Déplacement de la vignette
(function(){
  const self = $('self'), stage = $('stage');
  let drag = false, ox = 0, oy = 0;
  self.onpointerdown = e => {
    drag = true;
    const r = self.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    self.setPointerCapture(e.pointerId);
  };
  self.onpointermove = e => {
    if(!drag) return;
    const s = stage.getBoundingClientRect();
    let x = e.clientX - s.left - ox, y = e.clientY - s.top - oy;
    x = Math.max(0, Math.min(x, s.width - self.offsetWidth));
    y = Math.max(0, Math.min(y, s.height - self.offsetHeight));
    self.style.left = x + 'px'; self.style.top = y + 'px';
    self.style.right = 'auto'; self.style.bottom = 'auto';
  };
  self.onpointerup = () => { drag = false; };
})();
</script>
</body>
</html>
